# pnpm workspace + settings file.
#
# This repo is a single package (the root), so there are no workspace members
# to declare. The file exists because pnpm 11 reads non-auth settings from here
# (camelCase keys) rather than from .npmrc.
packages: []

# Force patched versions of transitive dependencies pulled in only by
# @lhci/cli (Lighthouse CI, dev-only tooling) that Dependabot flagged and
# that @lhci/cli itself won't bump on its own.
overrides:
  tmp: ^0.2.6
  uuid: ^11.1.1
  qs: '>=6.16.0'
  # extract-zip has no patched release upstream; @puppeteer/browsers 3.x
  # dropped it entirely (replaced with modern-tar). Safe here because
  # puppeteer-core's connect() path (the only one lighthouse/lhci uses —
  # it never calls launch()) only needs detectBrowserPlatform,
  # resolveDefaultUserDataDir and the Browser enum, all unchanged in 3.x.
  '@puppeteer/browsers': ^3.2.2

# Dependencies whose install/build scripts are allowed to run (pnpm blocks all
# by default). Sharp (Astro's image optimizer) and esbuild need theirs.
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain hardening: only install package versions that have been public
# for at least this many MINUTES, giving time for compromised releases to be
# spotted and yanked. 360 = 6h.
minimumReleaseAge: 360
